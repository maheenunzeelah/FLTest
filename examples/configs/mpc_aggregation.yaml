# MPC aggregation: the arithmetic that a float simulation hides.
#
# `secure_aggregation` masks in real arithmetic, so the masks cancel exactly and there is
# very little to get wrong. `mpc_aggregation` runs the protocol the way it is deployed, in a
# finite ring with fixed-point encoding, where three things go wrong quietly and still
# produce a finite, plausible-looking aggregate.
#
# Each arm below breaks one of them on purpose. Read `mpc-err` against the `exact` arm, and
# watch `mpc-ovf` and `mpc-drops`.
#
#   fltest pitfalls    examples/configs/mpc_aggregation.yaml   # catches three arms before any training
#   fltest run         examples/configs/mpc_aggregation.yaml   # measures what each one costs
#   fltest metamorphic examples/configs/mpc_aggregation.yaml   # masks cancel exactly, or they do not
#
# The metamorphic sweep varies the top-level defense and evaluates the first run, so the
# healthy MPC arm is listed first and inherits the top-level parameters.
name: mpc_aggregation_demo
device: cpu
dataset: mnist
model_name: MLP
num_clients: 6
num_rounds: 3
client_lr: 0.05
dataset_partitions: 40
max_test_data_size: 1024
metrics: [accuracy, loss]

defenses:
  - {name: mpc_aggregation, params: {quant_bits: 16, modulus: 4294967296, seed: 1}}

runs:
  # Enough precision and enough ring. This arm should match plain FedAvg exactly.
  - {framework: reference, name: mpc_ok}

  # Plain FedAvg. Every other arm is measured against this one.
  - {framework: reference, name: exact, defenses: []}

  # Too few fractional bits, so the quantization step grows past the updates it must carry.
  - {framework: reference, name: low_precision,
     defenses: [{name: mpc_aggregation, params: {quant_bits: 4, modulus: 4294967296, seed: 1}}]}

  # A ring too small for the weighted sum. Values wrap instead of raising.
  - {framework: reference, name: small_ring,
     defenses: [{name: mpc_aggregation, params: {quant_bits: 16, modulus: 4096, seed: 1}}]}

  # Clients dropped after masking. Their pairwise masks stay in the sum forever, because
  # FLTest implements no threshold secret sharing to repair them.
  - {framework: reference, name: dropouts,
     defenses: [{name: mpc_aggregation, params: {quant_bits: 16, modulus: 4294967296, seed: 1,
                                                 dropout_rate: 0.34}}]}

testing:
  metamorphic:
    # The mask seed changes which masks are drawn, and nothing else. A correct protocol
    # returns the identical aggregate for every seed, so the oracle is exact equality
    # rather than a tolerance.
    - {relation: secagg_lossless, parameter: defense.seed, values: [1, 2, 3],
       metric: gm_weight_sum, tolerance: 0.0}
